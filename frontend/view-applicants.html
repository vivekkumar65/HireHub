<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta http-equiv="Cache-Control"
          content="no-cache, no-store, must-revalidate">

    <meta http-equiv="Pragma"
          content="no-cache">

    <meta http-equiv="Expires"
          content="0">

    <title>Applicants - HireHub</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f8fafc;
            color: #111827;
        }

        .navbar {
            height: 72px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
        }

        .logo span {
            color: #2563eb;
        }

        .nav-links {
            display: flex;
            gap: 28px;
        }

        .nav-links a {
            text-decoration: none;
            color: #4b5563;
            font-size: 15px;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: #2563eb;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .role-btn {
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #dbeafe;
            padding: 10px 15px;
            border-radius: 9px;
            font-weight: 600;
        }

        .dashboard-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 17px;
            border-radius: 9px;
            font-weight: 600;
            cursor: pointer;
        }

        .dashboard-btn:hover {
            background: #1d4ed8;
        }

        .page-header {
            text-align: center;
            padding: 55px 20px 45px;
            background: linear-gradient(
                135deg,
                #eff6ff,
                #f8fafc
            );
            border-bottom: 1px solid #e5e7eb;
        }

        .header-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;
            border-radius: 16px;
            background: #dbeafe;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .page-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .page-header p {
            color: #6b7280;
            font-size: 16px;
        }

        .container {
            max-width: 1100px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .top-bar h2 {
            font-size: 22px;
        }

        .count {
            background: #eff6ff;
            color: #2563eb;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
        }

        .applicant-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 18px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            align-items: flex-start;
        }

        .candidate {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #dbeafe;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
        }

        .candidate h3 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .candidate p {
            color: #6b7280;
            font-size: 14px;
        }

        .job-info {
            margin-top: 20px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 10px;
        }

        .job-info strong {
            display: block;
            margin-bottom: 5px;
        }

        .job-info span {
            color: #6b7280;
            font-size: 14px;
        }

        .status {
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .status-applied {
            background: #fef3c7;
            color: #92400e;
        }

        .status-shortlisted {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status-selected {
            background: #dcfce7;
            color: #166534;
        }

        .status-rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid #e5e7eb;
        }

        .application-text {
            color: #6b7280;
            font-size: 13px;
        }

        .update-btn {
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 700;
            transition: 0.2s;
        }

        .update-btn:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .message {
            text-align: center;
            background: white;
            padding: 50px 20px;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
            color: #6b7280;
        }

        .message-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .message h3 {
            color: #111827;
            margin-bottom: 8px;
        }

        footer {
            margin-top: 80px;
            background: #111827;
            color: #9ca3af;
            text-align: center;
            padding: 35px 20px;
        }

        footer .logo {
            color: white;
            margin-bottom: 10px;
        }

        footer .logo span {
            color: #60a5fa;
        }

        footer p {
            font-size: 14px;
        }

        @media(max-width: 700px) {

            .navbar {
                padding: 15px 20px;
            }

            .nav-links {
                display: none;
            }

            .role-btn {
                display: none;
            }

            .card-top {
                flex-direction: column;
            }

            .card-bottom {
                flex-direction: column;
                align-items: stretch;
                gap: 15px;
            }

            .update-btn {
                text-align: center;
            }

            .page-header h1 {
                font-size: 27px;
            }

        }

    </style>

</head>


<body>


<nav class="navbar">

    <div class="logo">
        Hire<span>Hub</span>
    </div>


    <div class="nav-links">

        <a href="recruiter-dashboard.html">
            Dashboard
        </a>

        <a href="my-jobs.html">
            My Jobs
        </a>

        <a href="view-applicants.html">
            Applicants
        </a>

        <a href="profile.html">
            My Profile
        </a>

    </div>


    <div class="nav-buttons">

        <div class="role-btn">
            🏢 Recruiter
        </div>

        <button
            class="dashboard-btn"
            onclick="goDashboard()">

            Dashboard

        </button>

    </div>

</nav>


<section class="page-header">

    <div class="header-icon">
        👥
    </div>

    <h1>
        Applicants
    </h1>

    <p>
        View candidates who have applied for your jobs.
    </p>

</section>


<main class="container">

    <div class="top-bar">

        <h2>
            Candidate Applications
        </h2>

        <div
            class="count"
            id="applicationCount">

            0 Applications

        </div>

    </div>


    <div id="applicationsContainer">

        <div class="message">

            <div class="message-icon">
                ⏳
            </div>

            <h3>
                Loading Applications
            </h3>

            <p>
                Please wait...
            </p>

        </div>

    </div>

</main>


<footer>

    <div class="logo">
        Hire<span>Hub</span>
    </div>

    <p>
        © 2026 HireHub. All Rights Reserved.
    </p>

</footer>


<script>


function goDashboard() {

    window.location.href =
        "recruiter-dashboard.html";

}


function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function getStatusClass(status) {

    if (!status) {

        return "status-applied";

    }


    const value =
        String(status)
            .trim()
            .toLowerCase();


    if (value === "selected") {

        return "status-selected";

    }


    if (value === "rejected") {

        return "status-rejected";

    }


    if (
        value === "shortlisted" ||
        value === "shortlisted"
    ) {

        return "status-shortlisted";

    }


    return "status-applied";

}


function loadApplicants() {

    fetch(
        "/HireHub/viewApplicants",
        {
            method: "GET",
            cache: "no-store"
        }
    )

    .then(function(response) {

        if (!response.ok) {

            throw new Error(
                "Unable to load applicants."
            );

        }

        return response.json();

    })

    .then(function(data) {

        const applications =
            Array.isArray(data)
                ? data
                : [];


        const countElement =
            document.getElementById(
                "applicationCount"
            );


        countElement.textContent =
            applications.length +
            (
                applications.length === 1
                    ? " Application"
                    : " Applications"
            );


        const container =
            document.getElementById(
                "applicationsContainer"
            );


        if (applications.length === 0) {

            container.innerHTML = `

                <div class="message">

                    <div class="message-icon">
                        📭
                    </div>

                    <h3>
                        No Applications Yet
                    </h3>

                    <p>
                        No candidates have applied
                        for your jobs yet.
                    </p>

                </div>

            `;

            return;

        }


        container.innerHTML =
            applications.map(
                function(application) {


                    const name =
                        application.name ||
                        "Candidate";


                    const email =
                        application.email ||
                        "Email not available";


                    const title =
                        application.title ||
                        "Job Application";


                    const company =
                        application.company ||
                        "";


                    const location =
                        application.location ||
                        "";


                    const status =
                        application.status ||
                        "Applied";


                    /*
                     * Application ID is received
                     * automatically from servlet.
                     */

                    const applicationId =
                        application.applicationId;


                    /*
                     * If Application ID is missing,
                     * do not create a broken link.
                     */

                    let updateButton = "";


                    if (
                        applicationId !== null &&
                        applicationId !== undefined &&
                        String(applicationId).trim() !== ""
                    ) {


                        const updateUrl =
                            "update-status.html?applicationId=" +
                            encodeURIComponent(
                                applicationId
                            );


                        updateButton = `

                            <a
                                class="update-btn"
                                href="${updateUrl}">

                                Update Status →

                            </a>

                        `;

                    } else {

                        console.error(
                            "Application ID missing:",
                            application
                        );


                        updateButton = `

                            <span
                                style="
                                    color:#9ca3af;
                                    font-size:14px;
                                ">

                                Status unavailable

                            </span>

                        `;

                    }


                    const firstLetter =
                        name
                            .charAt(0)
                            .toUpperCase();


                    return `

                        <div class="applicant-card">


                            <div class="card-top">


                                <div class="candidate">


                                    <div class="avatar">

                                        ${escapeHtml(
                                            firstLetter
                                        )}

                                    </div>


                                    <div>

                                        <h3>

                                            ${escapeHtml(
                                                name
                                            )}

                                        </h3>


                                        <p>

                                            ${escapeHtml(
                                                email
                                            )}

                                        </p>

                                    </div>

                                </div>


                                <div
                                    class="status ${getStatusClass(
                                        status
                                    )}">

                                    ${escapeHtml(
                                        status
                                    )}

                                </div>

                            </div>


                            <div class="job-info">

                                <strong>

                                    ${escapeHtml(
                                        title
                                    )}

                                </strong>


                                <span>

                                    ${escapeHtml(
                                        company
                                    )}

                                    ${
                                        company &&
                                        location
                                            ? " • "
                                            : ""
                                    }

                                    ${escapeHtml(
                                        location
                                    )}

                                </span>

                            </div>


                            <div class="card-bottom">


                                <div
                                    class="application-text">

                                    Application received

                                </div>


                                ${updateButton}


                            </div>


                        </div>

                    `;

                }
            ).join("");

    })

    .catch(function(error) {

        console.error(
            "Applicants Error:",
            error
        );


        document.getElementById(
            "applicationCount"
        ).textContent =
            "0 Applications";


        document.getElementById(
            "applicationsContainer"
        ).innerHTML = `

            <div class="message">

                <div class="message-icon">
                    ⚠️
                </div>

                <h3>
                    Unable to Load Applications
                </h3>

                <p>
                    Please check that the server
                    is running and try again.
                </p>

                <br>

                <button
                    class="dashboard-btn"
                    onclick="loadApplicants()">

                    Try Again

                </button>

            </div>

        `;

    });

}


/*
 * Load applications when page opens.
 */

loadApplicants();


/*
 * Reload when browser returns
 * to this page.
 */

window.addEventListener(
    "pageshow",
    function() {

        loadApplicants();

    }
);


</script>


</body>

</html>
