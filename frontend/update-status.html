<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta http-equiv="Cache-Control"
          content="no-cache, no-store, must-revalidate">

    <meta http-equiv="Pragma"
          content="no-cache">

    <meta http-equiv="Expires"
          content="0">

    <title>Update Application Status - HireHub</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f8fafc;
            color: #111827;
            min-height: 100vh;
        }

        .navbar {
            height: 72px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
        }

        .logo span {
            color: #2563eb;
        }

        .nav-links {
            display: flex;
            gap: 28px;
        }

        .nav-links a {
            text-decoration: none;
            color: #4b5563;
            font-size: 15px;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: #2563eb;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .role-btn {
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #dbeafe;
            padding: 10px 15px;
            border-radius: 9px;
            font-weight: 600;
        }

        .dashboard-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 17px;
            border-radius: 9px;
            font-weight: 600;
            cursor: pointer;
        }

        .page-header {
            text-align: center;
            padding: 55px 20px 45px;
            background: linear-gradient(
                135deg,
                #eff6ff,
                #f8fafc
            );
            border-bottom: 1px solid #e5e7eb;
        }

        .header-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;
            border-radius: 16px;
            background: #dbeafe;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .page-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .page-header p {
            color: #6b7280;
            font-size: 16px;
        }

        .form-wrapper {
            max-width: 650px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .form-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .application-info {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 28px;
        }

        .info-label {
            color: #6b7280;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .job-title {
            font-size: 20px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 6px;
        }

        .candidate-name {
            color: #6b7280;
            font-size: 14px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #374151;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: white;
            font-size: 15px;
            outline: none;
            cursor: pointer;
        }

        select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px #dbeafe;
        }

        .update-btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .update-btn:hover {
            background: #1d4ed8;
        }

        .cancel-btn {
            display: block;
            text-align: center;
            margin-top: 12px;
            padding: 13px;
            border-radius: 10px;
            background: #f3f4f6;
            color: #374151;
            text-decoration: none;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            color: #6b7280;
            margin-bottom: 20px;
        }

        footer {
            margin-top: 70px;
            background: #111827;
            color: #9ca3af;
            text-align: center;
            padding: 35px 20px;
        }

        footer .logo {
            color: white;
            margin-bottom: 10px;
        }

        footer .logo span {
            color: #60a5fa;
        }

        footer p {
            font-size: 14px;
        }

        @media(max-width: 800px) {

            .navbar {
                padding: 15px 20px;
            }

            .nav-links {
                display: none;
            }

        }

        @media(max-width: 550px) {

            .role-btn {
                display: none;
            }

            .form-card {
                padding: 25px 20px;
            }

            .page-header h1 {
                font-size: 27px;
            }

        }

    </style>

</head>


<body>


<nav class="navbar">

    <div class="logo">
        Hire<span>Hub</span>
    </div>

    <div class="nav-links">

        <a href="recruiter-dashboard.html">
            Dashboard
        </a>

        <a href="my-jobs.html">
            My Jobs
        </a>

        <a href="view-applicants.html">
            Applicants
        </a>

        <a href="profile.html">
            My Profile
        </a>

    </div>

    <div class="nav-buttons">

        <div class="role-btn">
            🏢 Recruiter
        </div>

        <button
            class="dashboard-btn"
            onclick="window.location.href='recruiter-dashboard.html'">

            Dashboard

        </button>

    </div>

</nav>


<section class="page-header">

    <div class="header-icon">
        🔄
    </div>

    <h1>
        Update Application Status
    </h1>

    <p>
        Update the status of candidates who applied for your jobs.
    </p>

</section>


<section class="form-wrapper">

    <div class="form-card">

        <div
            id="loading"
            class="loading">

            Loading application...

        </div>


        <div
            id="applicationInfo"
            class="application-info"
            style="display:none;">

            <div class="info-label">
                Applied For
            </div>

            <div
                id="jobTitle"
                class="job-title">

                Job Title

            </div>

            <div
                id="candidateName"
                class="candidate-name">

                Candidate

            </div>

        </div>


        <form
            action="/HireHub/updateStatus"
            method="POST"
            id="statusForm"
            style="display:none;">

            <!-- Application ID automatically stored here -->

            <input
                type="hidden"
                name="applicationId"
                id="applicationId">


            <label for="status">

                New Status

            </label>


            <select
                name="status"
                id="status"
                required>

                <option value="">
                    Select Status
                </option>

                <option value="Applied">
                    Applied
                </option>

                <option value="Selected">
                    Selected
                </option>

                <option value="Rejected">
                    Rejected
                </option>

            </select>


            <button
                type="submit"
                class="update-btn">

                ✓ Update Status

            </button>


            <a
                href="view-applicants.html"
                class="cancel-btn">

                Back to Applicants

            </a>

        </form>

    </div>

</section>


<footer>

    <div class="logo">
        Hire<span>Hub</span>
    </div>

    <p>
        © 2026 HireHub. All Rights Reserved.
    </p>

</footer>


<script>

    const params =
        new URLSearchParams(
            window.location.search
        );


    const applicationId =
        params.get("applicationId");


    /*
     * Application ID URL se automatically
     * receive hogi.
     */

    if (!applicationId) {

        alert(
            "Application information is missing."
        );

        window.location.href =
            "view-applicants.html";

    } else {

        document.getElementById(
            "applicationId"
        ).value = applicationId;


        fetch(
            "/HireHub/viewApplicants",
            {
                cache: "no-store"
            }
        )

        .then(function(response) {

            return response.json();

        })

        .then(function(data) {

            const applications =
                Array.isArray(data)
                    ? data
                    : [];


            const application =
                applications.find(
                    function(item) {

                        return String(
                            item.applicationId
                        ) === String(
                            applicationId
                        );

                    }
                );


            if (!application) {

                alert(
                    "Application not found."
                );

                window.location.href =
                    "view-applicants.html";

                return;

            }


            document.getElementById(
                "jobTitle"
            ).textContent =
                application.title ||
                "Job Application";


            document.getElementById(
                "candidateName"
            ).textContent =
                application.name ||
                "Candidate";


            document.getElementById(
                "status"
            ).value =
                application.status ||
                "Applied";


            document.getElementById(
                "loading"
            ).style.display =
                "none";


            document.getElementById(
                "applicationInfo"
            ).style.display =
                "block";


            document.getElementById(
                "statusForm"
            ).style.display =
                "block";

        })

        .catch(function(error) {

            console.error(error);

            document.getElementById(
                "loading"
            ).textContent =
                "Unable to load application.";

        });

    }

</script>


</body>

</html>
