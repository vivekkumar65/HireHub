<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta http-equiv="Cache-Control"
          content="no-cache, no-store, must-revalidate">

    <meta http-equiv="Pragma"
          content="no-cache">

    <meta http-equiv="Expires"
          content="0">

    <title>Edit Profile - HireHub</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #111827;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR */

        .navbar {
            height: 70px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #111827;
        }

        .logo span {
            color: #2563eb;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: #374151;
            font-size: 15px;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: #2563eb;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            border: none;
            padding: 10px 17px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .profile-btn {
            background: transparent;
            color: #2563eb;
        }

        .dashboard-btn {
            background: #2563eb;
            color: white;
        }

        /* HEADER */

        .page-header {
            text-align: center;
            padding: 55px 20px 35px;
            background: linear-gradient(
                135deg,
                #eff6ff,
                #f8fafc
            );
        }

        .page-header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .page-header p {
            color: #6b7280;
            font-size: 16px;
        }

        /* FORM */

        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 35px 20px 60px;
        }

        .form-card {
            width: 100%;
            max-width: 620px;
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
        }

        .form-title {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        input[readonly] {
            background: #f3f4f6;
            color: #6b7280;
            cursor: not-allowed;
        }

        .button-row {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        .btn {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }

        .save-btn {
            background: #2563eb;
            color: white;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        .cancel-btn {
            background: #f3f4f6;
            color: #374151;
        }

        .cancel-btn:hover {
            background: #e5e7eb;
        }

        /* FOOTER */

        footer {
            background: #0f172a;
            color: #94a3b8;
            padding: 28px 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        footer .logo {
            color: white;
        }

        footer p {
            font-size: 13px;
        }

        /* MOBILE */

        @media (max-width: 750px) {

            .navbar {
                padding: 0 20px;
            }

            .nav-links {
                display: none;
            }

            .page-header h1 {
                font-size: 30px;
            }

            .form-card {
                padding: 25px 20px;
            }

            footer {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            .button-row {
                flex-direction: column;
            }
        }

    </style>

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Hire<span>Hub</span>
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="jobs.html">
                Jobs
            </a>

            <a id="dashboardLink"
               href="#">
                Dashboard
            </a>

        </div>

        <div class="nav-buttons">

            <button class="nav-btn profile-btn"
                    onclick="window.location.href='profile.html'">
                👤 Profile
            </button>

            <button class="nav-btn dashboard-btn"
                    id="dashboardButton">
                Dashboard
            </button>

        </div>

    </nav>


    <header class="page-header">

        <h1>Edit Profile</h1>

        <p>
            Update your account information
        </p>

    </header>


    <main class="main">

        <div class="form-card">

            <div class="form-title">
                Personal Information
            </div>

            <form action="/HireHub/editProfile"
                  method="POST">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        name="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="role">
                        Account Role
                    </label>

                    <input
                        type="text"
                        id="role"
                        readonly
                    >

                </div>


                <div class="button-row">

                    <a
                        href="profile.html"
                        class="btn cancel-btn">
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn save-btn">
                        💾 Save Changes
                    </button>

                </div>

            </form>

        </div>

    </main>


    <footer>

        <div class="logo">
            Hire<span>Hub</span>
        </div>

        <p>
            © 2026 HireHub. All Rights Reserved.
        </p>

    </footer>


    <script>

        fetch("/HireHub/profile", {
            cache: "no-store"
        })

        .then(function(response) {

            return response.json();

        })

        .then(function(data) {

            if (data.error) {

                window.location.href =
                    "login.html";

                return;
            }

            document.getElementById("name").value =
                data.name || "";

            document.getElementById("email").value =
                data.email || "";

            document.getElementById("role").value =
                data.role || "";

            let dashboard =
                "jobseeker-dashboard.html";

            if (
                data.role &&
                data.role.toLowerCase() === "recruiter"
            ) {

                dashboard =
                    "recruiter-dashboard.html";
            }

            document.getElementById(
                "dashboardLink"
            ).href = dashboard;

            document.getElementById(
                "dashboardButton"
            ).onclick = function() {

                window.location.href = dashboard;

            };

        })

        .catch(function(error) {

            console.error(error);

            alert(
                "Unable to load profile."
            );

        });

    </script>

</body>

</html>
