<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta http-equiv="Cache-Control"
          content="no-cache, no-store, must-revalidate">

    <meta http-equiv="Pragma"
          content="no-cache">

    <meta http-equiv="Expires"
          content="0">

    <title>My Profile - HireHub</title>

    <link rel="stylesheet"
          href="style.css">

    <style>

        body {
            background: #f5f7fb;
        }

        .profile-page {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .profile-hero {
            background: white;
            border-radius: 18px;
            padding: 35px;
            display: flex;
            align-items: center;
            gap: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.07);
            margin-bottom: 25px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .profile-hero-info h1 {
            margin: 0 0 8px;
            font-size: 30px;
            color: #111827;
        }

        .profile-hero-info p {
            margin: 0 0 12px;
            color: #64748b;
            font-size: 15px;
        }

        .role-badge {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 20px;
            background: #eff6ff;
            color: #2563eb;
            font-size: 13px;
            font-weight: 600;
        }

        .profile-card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }

        .profile-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 18px;
            border-bottom: 1px solid #e5e7eb;
        }

        .profile-card-header h2 {
            margin: 0;
            font-size: 21px;
            color: #111827;
        }

        .profile-card-header p {
            margin: 5px 0 0;
            color: #64748b;
            font-size: 13px;
        }

        .profile-info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .info-box {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            background: #fafbfc;
        }

        .info-label {
            display: block;
            font-size: 12px;
            color: #64748b;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .info-value {
            font-size: 16px;
            color: #111827;
            font-weight: 600;
            word-break: break-word;
        }

        .profile-actions {
            display: flex;
            gap: 14px;
            margin-top: 28px;
            padding-top: 25px;
            border-top: 1px solid #e5e7eb;
        }

        .profile-action-btn {
            border: none;
            border-radius: 10px;
            padding: 13px 22px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .edit-profile-btn {
            background: #2563eb;
            color: white;
        }

        .edit-profile-btn:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .password-btn {
            background: #f1f5f9;
            color: #334155;
        }

        .password-btn:hover {
            background: #e2e8f0;
        }

        .dashboard-btn {
            background: white;
            color: #2563eb;
            border: 1px solid #2563eb;
        }

        .dashboard-btn:hover {
            background: #eff6ff;
        }

        @media (max-width: 700px) {

            .profile-page {
                margin-top: 30px;
            }

            .profile-hero {
                flex-direction: column;
                text-align: center;
                padding: 30px 20px;
            }

            .profile-hero-info h1 {
                font-size: 25px;
            }

            .profile-info-grid {
                grid-template-columns: 1fr;
            }

            .profile-actions {
                flex-direction: column;
            }

            .profile-action-btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <nav class="navbar">

        <div class="logo">
            Online<span>JobPortal</span>
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="jobs.html">
                Jobs
            </a>

            <a href="jobseeker-dashboard.html">
                Dashboard
            </a>

        </div>

        <div class="nav-buttons">

            <button
                class="login-btn"
                onclick="window.location.href='profile.html'">

                👤 Profile

            </button>

            <button
                class="register-btn"
                onclick="logout()">

                Logout

            </button>

        </div>

    </nav>


    <main class="profile-page">


        <section class="profile-hero">

            <div
                class="profile-avatar"
                id="profileAvatar">

                U

            </div>

            <div class="profile-hero-info">

                <h1 id="profileName">
                    Loading...
                </h1>

                <p id="profileEmail">
                    Loading profile information...
                </p>

                <span
                    class="role-badge"
                    id="profileRole">

                    Account

                </span>

            </div>

        </section>


        <section class="profile-card">

            <div class="profile-card-header">

                <div>

                    <h2>
                        Account Information
                    </h2>

                    <p>
                        Your basic account details
                    </p>

                </div>

            </div>


            <div class="profile-info-grid">

                <div class="info-box">

                    <span class="info-label">
                        Full Name
                    </span>

                    <span
                        class="info-value"
                        id="name">

                        Loading...

                    </span>

                </div>


                <div class="info-box">

                    <span class="info-label">
                        Email Address
                    </span>

                    <span
                        class="info-value"
                        id="email">

                        Loading...

                    </span>

                </div>


                <div class="info-box">

                    <span class="info-label">
                        Account Type
                    </span>

                    <span
                        class="info-value"
                        id="role">

                        Loading...

                    </span>

                </div>


                <div class="info-box">

                    <span class="info-label">
                        Account Status
                    </span>

                    <span class="info-value">
                        🟢 Active
                    </span>

                </div>

            </div>


            <div class="profile-actions">

                <button
                    class="profile-action-btn edit-profile-btn"
                    onclick="window.location.href='edit-profile.html'">

                    ✏️ Edit Profile

                </button>


                <button
                    class="profile-action-btn password-btn"
                    onclick="window.location.href='change-password.html'">

                    🔐 Change Password

                </button>


                <button
                    class="profile-action-btn dashboard-btn"
                    onclick="goToDashboard()">

                    🏠 Dashboard

                </button>

            </div>

        </section>

    </main>


    <footer>

        <div class="logo">
            Online<span>JobPortal</span>
        </div>

        <p>
            © 2026 Online Job Portal.
            All Rights Reserved.
        </p>

    </footer>


    <script>

        // ==================================================
        // CHECK SESSION
        // ==================================================

        function checkSession() {

            fetch("/HireHub/profile", {
                method: "GET",
                cache: "no-store"
            })

            .then(function(response) {

                if (!response.ok) {
                    throw new Error("Not logged in");
                }

                return response.json();

            })

            .then(function(data) {

                if (
                    !data ||
                    data.error ||
                    !data.name
                ) {

                    window.location.replace(
                        "/HireHub/login.html"
                    );

                    return;
                }


                let name =
                    data.name || "User";

                let email =
                    data.email || "";

                let role =
                    data.role || "User";


                document.getElementById(
                    "profileName"
                ).innerText = name;

                document.getElementById(
                    "profileEmail"
                ).innerText = email;

                document.getElementById(
                    "profileRole"
                ).innerText = role;

                document.getElementById(
                    "name"
                ).innerText = name;

                document.getElementById(
                    "email"
                ).innerText = email;

                document.getElementById(
                    "role"
                ).innerText = role;


                let firstLetter =
                    name.trim()
                        .charAt(0)
                        .toUpperCase();


                document.getElementById(
                    "profileAvatar"
                ).innerText = firstLetter;

            })

            .catch(function() {

                window.location.replace(
                    "/HireHub/login.html"
                );

            });

        }


        // ==================================================
        // INITIAL SESSION CHECK
        // ==================================================

        checkSession();


        // ==================================================
        // BACK BUTTON / BFCACHE CHECK
        // ==================================================

        window.addEventListener(
            "pageshow",
            function() {

                checkSession();

            }
        );


        // ==================================================
        // DASHBOARD
        // ==================================================

        function goToDashboard() {

            fetch("/HireHub/profile", {
                cache: "no-store"
            })

            .then(function(response) {

                if (!response.ok) {
                    throw new Error();
                }

                return response.json();

            })

            .then(function(data) {

                if (
                    data.role &&
                    data.role.toLowerCase()
                        .includes("recruiter")
                ) {

                    window.location.href =
                        "recruiter-dashboard.html";

                } else {

                    window.location.href =
                        "jobseeker-dashboard.html";

                }

            })

            .catch(function() {

                window.location.replace(
                    "/HireHub/login.html"
                );

            });

        }


        // ==================================================
        // LOGOUT
        // ==================================================

        function logout() {

            window.location.replace(
                "/HireHub/logout"
            );

        }

    </script>

</body>

</html>
